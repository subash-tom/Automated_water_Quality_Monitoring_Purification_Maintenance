<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bank Payments - Water Quality Monitoring Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* ================= HEADER ================= */

        .header {
            background: #1664d9;
            color: white;
            padding: 36px 60px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .header p {
            margin: 18px 0 0;
            font-size: 20px;
        }

        /* ================= MAIN CARD ================= */

        .container {
            width: 94%;
            max-width: 1625px;
            margin: 42px auto;
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* ================= TOP BAR ================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-title {
            margin: 0;
            color: #152238;
            font-size: 34px;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* ================= BUTTONS ================= */

        .btn {
            display: inline-block;
            padding: 14px 22px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .dashboard-btn {
            background: #198754;
        }

        .dashboard-btn:hover {
            background: #157347;
        }

        .add-btn {
            background: #1664d9;
        }

        .add-btn:hover {
            background: #0d4fae;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1150px;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #20252b;
            color: white;
            padding: 17px 22px;
            text-align: left;
            font-size: 17px;
            font-weight: 700;
            white-space: nowrap;
        }

        td {
            padding: 17px 22px;
            border-bottom: 1px solid #e1e5ea;
            text-align: left;
            font-size: 16px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #f7f9fc;
        }

        /* ================= DELETE ================= */

        .delete {
            color: #dc2626;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .delete:hover {
            text-decoration: underline;
            color: #b91c1c;
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 35px;
            color: #777;
            font-size: 16px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .header {
                padding: 28px 22px;
            }

            .header h1 {
                font-size: 25px;
            }

            .header p {
                font-size: 16px;
                margin-top: 10px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
                padding: 22px;
                border-radius: 14px;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title {
                font-size: 26px;
            }

            .actions {
                width: 100%;
            }

            .btn {
                font-size: 14px;
                padding: 11px 16px;
            }

            th,
            td {
                padding: 13px 15px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        💧 Water Quality Monitoring Hub
    </h1>

    <p>
        Vendor Payment & Bank Transaction Management
    </p>

</div>


<!-- ================= MAIN CONTAINER ================= -->

<div class="container">


    <!-- ================= TOP BAR ================= -->

    <div class="top-bar">

        <h2 class="page-title">
            💰 Bank Payments
        </h2>


        <div class="actions">

            <a href="/dashboard"
               class="btn dashboard-btn">

                🏠 Dashboard

            </a>


            <a href="/bank-payments/add"
               class="btn add-btn">

                ➕ Make Payment

            </a>

        </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Vendor Bill</th>

                <th>Vendor</th>

                <th>Amount</th>

                <th>Payment Date</th>

                <th>Method</th>

                <th>Reference</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>


            <!-- PAYMENT DATA -->

            <tr th:each="payment : ${payments}">


                <td th:text="${payment.id}">
                    1
                </td>


                <td th:text="${payment.vendorBill.billNumber}">
                    BILL-001
                </td>


                <td th:text="${payment.vendorBill.vendor.name}">
                    ABC Chemicals
                </td>


                <td>

                    ₹<span th:text="${payment.amount}">
                    </span>

                </td>


                <td th:text="${payment.paymentDate}">
                    2026-09-24
                </td>


                <td th:text="${payment.paymentMethod}">
                    BANK_TRANSFER
                </td>


                <td th:text="${payment.transactionNumber}">
                    TXN-1001
                </td>


                <td>

                    <a class="delete"
                       th:href="@{/bank-payments/delete/{id}(id=${payment.id})}"
                       onclick="return confirm('Delete this payment?')">

                        Delete

                    </a>

                </td>


            </tr>


            <!-- EMPTY MESSAGE -->

            <tr th:if="${#lists.isEmpty(payments)}">

                <td colspan="8"
                    class="empty">

                    No Bank Payments found.

                </td>

            </tr>


            </tbody>

        </table>

    </div>


</div>


</body>

</html>
