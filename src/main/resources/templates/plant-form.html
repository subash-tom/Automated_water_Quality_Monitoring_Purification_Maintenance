<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Plant</title>

    <style>

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 650px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .buttons {
            margin-top: 30px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel {
            background: #777;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 7px;
            margin-left: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add Plant</h1>

    <!-- IMPORTANT -->
    <form th:action="@{/plants/save}"
          th:object="${plant}"
          method="post">

        <label>Plant Name</label>

        <input type="text"
               th:field="*{name}"
               required>


        <label>Location</label>

        <input type="text"
               th:field="*{location}"
               required>


        <label>Minimum pH</label>

        <input type="number"
               th:field="*{minimumPh}"
               step="0.1"
               value="6.5"
               required>


        <label>Maximum pH</label>

        <input type="number"
               th:field="*{maximumPh}"
               step="0.1"
               value="8.5"
               required>


        <label>Current pH</label>

        <input type="number"
               th:field="*{currentPh}"
               step="0.1"
               required>


        <div class="buttons">

            <button type="submit">
                Save
            </button>

            <a class="cancel"
               th:href="@{/plants}">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
