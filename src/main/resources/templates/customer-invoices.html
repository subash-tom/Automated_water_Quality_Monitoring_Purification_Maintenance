<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Invoices - Water Quality Monitoring Hub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* ================= HEADER ================= */

       .header {
            background: #1664d9;
            color: white;
            padding: 36px 60px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .header p {
            margin: 18px 0 0;
            font-size: 20px;
        }



        /* ================= MAIN CONTAINER ================= */

        .container {
            width: 94%;
            max-width: 1400px;
            margin: 32px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* ================= TOP BAR ================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            color: #20252b;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ================= BUTTONS ================= */

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn-dashboard {
            background: #198754;
        }

        .btn-dashboard:hover {
            background: #157347;
        }

        .btn-add {
            background: #1664d9;
        }

        .btn-add:hover {
            background: #0d4fae;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #20252b;
            color: white;
            padding: 15px 13px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        td {
            padding: 14px 13px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
            font-size: 14px;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f5f8fc;
        }

        /* ================= STATUS ================= */

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .unpaid {
            color: #9a6700;
            background: #fff3cd;
        }

        .paid {
            color: #146c43;
            background: #d1e7dd;
        }

        /* ================= DELETE ================= */

        .delete-link {
            color: #dc3545;
            text-decoration: none;
            font-weight: 600;
        }

        .delete-link:hover {
            color: #a71d2a;
            text-decoration: underline;
        }

        /* ================= EMPTY ================= */

        .empty-message {
            text-align: center !important;
            padding: 30px !important;
            color: #777;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .header {
                padding: 26px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

            .header p {
                font-size: 14px;
            }

            .container {
                width: 96%;
                margin: 20px auto;
                padding: 20px;
                border-radius: 12px;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title {
                font-size: 24px;
            }

            .actions {
                width: 100%;
            }

            .btn {
                padding: 11px 15px;
            }
        }

    </style>

</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        💧 Water Quality Monitoring Hub
    </h1>

    <p>
        Commercial Water Customer Invoice Management
    </p>

</div>


<!-- ================= MAIN CONTAINER ================= -->

<div class="container">

    <!-- ================= TOP BAR ================= -->

    <div class="top-bar">

        <h2 class="page-title">
            🧾 Customer Invoices
        </h2>

        <div class="actions">

            <a href="/dashboard"
               class="btn btn-dashboard">

                🏠 Dashboard

            </a>

            <a href="/customer-invoices/add"
               class="btn btn-add">

                ➕ Create Invoice

            </a>

        </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>ID</th>

                <th>Invoice Number</th>

                <th>Customer</th>

                <th>Sales Order</th>

                <th>Amount</th>

                <th>Invoice Date</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>

            <!-- ================= INVOICE ROWS ================= -->

            <tr th:each="invoice : ${invoices}">

                <td th:text="${invoice.id}">
                    1
                </td>

                <td th:text="${invoice.invoiceNumber}">
                    INV-001
                </td>

                <td th:text="${invoice.customer.name}">
                    Customer Name
                </td>

                <td th:text="${'SO-' + invoice.salesOrder.id}">
                    SO-1
                </td>

                <td th:text="${'₹' + invoice.amount}">
                    ₹0
                </td>

                <td th:text="${invoice.invoiceDate}">
                    2026-09-25
                </td>

                <td>

                    <!-- UNPAID -->

                    <span th:if="${invoice.status == 'UNPAID'}"
                          class="status unpaid">

                        UNPAID

                    </span>


                    <!-- PAID -->

                    <span th:if="${invoice.status == 'PAID'}"
                          class="status paid">

                        PAID

                    </span>

                </td>

                <td>

                    <a class="delete-link"
                       th:href="@{/customer-invoices/delete/{id}(id=${invoice.id})}"
                       onclick="return confirm('Delete this invoice?')">

                        Delete

                    </a>

                </td>

            </tr>


            <!-- ================= EMPTY STATE ================= -->

            <tr th:if="${#lists.isEmpty(invoices)}">

                <td colspan="8"
                    class="empty-message">

                    No customer invoices found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
