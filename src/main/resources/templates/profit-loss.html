<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profit &amp; Loss - Water Quality</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        /* ================= HEADER ================= */

          .header {
            background: #1664d9;
            color: white;
            padding: 36px 60px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .header p {
            margin: 18px 0 0;
            font-size: 20px;
        }


        /* ================= MAIN CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }


        .main-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }


        /* ================= TOP BAR ================= */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 30px;
        }


        .top-bar h2 {
            margin: 0;
            font-size: 28px;
            color: #152238;
        }


        /* ================= DASHBOARD BUTTON ================= */

        .dashboard-btn {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 11px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }


        .dashboard-btn:hover {
            background: #157347;
        }


        /* ================= PROFIT LOSS SHEET ================= */

        .sheet {
            width: 100%;
            border: 1px solid #e1e5ea;
            border-radius: 10px;
            overflow: hidden;
        }


        .sheet-header {
            background: #20252b;
            color: white;
            padding: 17px 20px;
            font-size: 18px;
            font-weight: bold;
        }


        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 16px;
            background: white;
        }


        .row:last-child {
            border-bottom: none;
        }


        .row:hover {
            background: #f8fbff;
        }


        .label {
            font-weight: 600;
            color: #333;
        }


        /* ================= INCOME ================= */

        .income .amount {
            color: #198754;
            font-weight: bold;
            font-size: 17px;
        }


        /* ================= EXPENSE ================= */

        .expense .amount {
            color: #dc3545;
            font-weight: bold;
            font-size: 17px;
        }


        /* ================= PROFIT ================= */

        .profit {
            background: #f0f8f4;
        }


        .profit .label {
            font-weight: bold;
        }


        .profit .amount {
            color: #1664d9;
            font-size: 20px;
            font-weight: bold;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .header {
                padding: 22px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .main-card {
                padding: 20px;
            }

            .top-bar {
                align-items: center;
            }

            .top-bar h2 {
                font-size: 23px;
            }

            .dashboard-btn {
                padding: 10px 14px;
                font-size: 13px;
            }

            .row {
                padding: 16px;
            }
        }


        @media (max-width: 500px) {

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .top-bar h2 {
                text-align: center;
            }

            .dashboard-btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <h1>
        💧 Water Quality Monitoring Hub
    </h1>

    <p>
        Financial Accounting &amp; Profit &amp; Loss Management
    </p>

</header>



<!-- ================= MAIN ================= -->

<div class="container">

    <div class="main-card">


        <!-- TITLE + DASHBOARD -->

        <div class="top-bar">

            <h2>
                📈 Profit &amp; Loss Account
            </h2>

            <a th:href="@{/reports}"
               class="dashboard-btn">

                📊 Report

            </a>

        </div>



        <!-- PROFIT & LOSS -->

        <div class="sheet">


            <div class="sheet-header">

                Financial Performance

            </div>



            <!-- INCOME -->

            <div class="row income">

                <span class="label">

                    Water Supply Revenue

                </span>

                <span class="amount"
                      th:text="${income}">

                    0

                </span>

            </div>



            <!-- EXPENSE -->

            <div class="row expense">

                <span class="label">

                    Maintenance &amp; Chemical Expenses

                </span>

                <span class="amount"
                      th:text="${expenses}">

                    0

                </span>

            </div>



            <!-- PROFIT -->

            <div class="row profit">

                <span class="label">

                    Net Profit / Loss

                </span>

                <span class="amount"
                      th:text="${profit}">

                    0

                </span>

            </div>


        </div>


    </div>

</div>


</body>

</html>
