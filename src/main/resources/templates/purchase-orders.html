<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Purchase Orders</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background: #212529;
            color: white;
        }

        .add {
            display: inline-block;
            padding: 10px 15px;
            background: #198754;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .edit {
            background: #0d6efd;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background: #dc3545;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Purchase Orders</h1>

    <a href="/purchase-orders/add"
       class="add">
        + Add Purchase Order
    </a>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Order Number</th>
            <th>Vendor ID</th>
            <th>Order Date</th>
            <th>Expected Date</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Description</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="po : ${purchaseOrders}">

            <td th:text="${po.id}"></td>

            <td th:text="${po.orderNumber}"></td>

            <td th:text="${po.vendorId}"></td>

            <td th:text="${po.orderDate}"></td>

            <td th:text="${po.expectedDate}"></td>

            <td th:text="${po.totalAmount}"></td>

            <td th:text="${po.status}"></td>

            <td th:text="${po.description}"></td>

            <td>

                <a class="edit"
                   th:href="@{/purchase-orders/edit/{id}(id=${po.id})}">
                    Edit
                </a>

                <a class="delete"
                   th:href="@{/purchase-orders/delete/{id}(id=${po.id})}"
                   onclick="return confirm('Delete this purchase order?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(purchaseOrders)}">

            <td colspan="9"
                style="text-align:center;">
                No Purchase Orders found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
