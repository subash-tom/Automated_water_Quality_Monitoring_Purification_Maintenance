<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Vendor Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }

    </style>

</head>

<body>

<div class="container">

    <h2 th:if="${vendor.id == null}">
        Add Vendor
    </h2>

    <h2 th:if="${vendor.id != null}">
        Edit Vendor
    </h2>


    <!-- ============================= -->
    <!-- ADD VENDOR -->
    <!-- ============================= -->

    <form th:if="${vendor.id == null}"
          th:action="@{/vendors/save}"
          th:object="${vendor}"
          method="post">

        <label>Vendor Name</label>

        <input type="text"
               th:field="*{name}"
               placeholder="Enter vendor name"
               required>


        <label>Contact Person</label>

        <input type="text"
               th:field="*{contactPerson}"
               placeholder="Enter contact person">


        <label>Phone</label>

        <input type="text"
               th:field="*{phone}"
               placeholder="Enter phone number">


        <label>Email</label>

        <input type="email"
               th:field="*{email}"
               placeholder="Enter email">


        <label>Address</label>

        <textarea th:field="*{address}"
                  placeholder="Enter address"></textarea>


        <button type="submit">
            Save Vendor
        </button>

    </form>


    <!-- ============================= -->
    <!-- EDIT VENDOR -->
    <!-- ============================= -->

    <form th:if="${vendor.id != null}"
          th:action="@{/vendors/update/{id}(id=${vendor.id})}"
          th:object="${vendor}"
          method="post">

        <label>Vendor Name</label>

        <input type="text"
               th:field="*{name}"
               required>


        <label>Contact Person</label>

        <input type="text"
               th:field="*{contactPerson}">


        <label>Phone</label>

        <input type="text"
               th:field="*{phone}">


        <label>Email</label>

        <input type="email"
               th:field="*{email}">


        <label>Address</label>

        <textarea th:field="*{address}"></textarea>


        <button type="submit">
            Update Vendor
        </button>

    </form>


    <a class="back"
       th:href="@{/vendors}">
        ← Back to Vendors
    </a>

</div>

</body>

</html>
