<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Customers</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .add-button {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        .edit {
            color: #0d6efd;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            color: #dc3545;
            text-decoration: none;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Customers</h1>

    <a class="add-button"
       th:href="@{/customers/add}">
        + Add Customer
    </a>

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Contact Person</th>

            <th>Phone</th>

            <th>Email</th>

            <th>Address</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="customer : ${customers}">

            <td th:text="${customer.id}">
            </td>

            <td th:text="${customer.name}">
            </td>

            <td th:text="${customer.contactPerson}">
            </td>

            <td th:text="${customer.phone}">
            </td>

            <td th:text="${customer.email}">
            </td>

            <td th:text="${customer.address}">
            </td>

            <td>

                <a class="edit"
                   th:href="@{/customers/edit/{id}(id=${customer.id})}">
                    Edit
                </a>

                <a class="delete"
                   th:href="@{/customers/delete/{id}(id=${customer.id})}"
                   onclick="return confirm('Are you sure you want to delete this customer?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(customers)}">

            <td colspan="7"
                class="empty">

                No customers found.

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
